name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Provisioned rather than relying on a committed ./gradlew.
      # Quote the version: unquoted 8.8 is a YAML float.
      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.8'
          cache-provider: basic

      - name: Check the tag matches mod_version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match mod_version=$VERSION." >&2
            echo "Bump mod_version in gradle.properties, or tag the matching version." >&2
            exit 1
          fi

      # Maven Central throttles shared runners with HTTP 429, which is transient.
      - name: Build the mod
        run: |
          for attempt in 1 2 3; do
            if gradle build --no-daemon; then exit 0; fi
            echo "Build attempt $attempt failed, retrying in 30s..." >&2
            sleep 30
          done
          exit 1

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          TAG="v$VERSION"
          JAR=$(ls build/libs/*.jar | grep -v sources | head -n 1)
          gh release create "$TAG" "$JAR" \
            --target "$GITHUB_SHA" \
            --title "Agrarian Futures $TAG" \
            --notes "Fabric 1.20.1 mod. Needs Fabric API 0.92.x. Craft a Ticker Board, sell farm goods for emeralds, and watch prices change every 3 days. Flood one market (1728 items) and it crashes to zero for 7 days. See the README for details."
