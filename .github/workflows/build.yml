name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: agrarianfutures-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            exit 0
          fi
          JAR=$(ls build/libs/*.jar | grep -v sources | head -n 1)
          gh release create "$TAG" "$JAR" \
            --target "$GITHUB_SHA" \
            --title "Agrarian Futures $TAG" \
            --notes "Fabric 1.20.1 mod. Needs Fabric API 0.92.x. Craft a Ticker Board, sell farm goods for emeralds, and watch prices change every 3 days. Flood one market (1728 items) and it crashes to zero for 7 days. See the README for details."
