name: build

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Provisioned rather than relying on a committed ./gradlew.
      # Quote the version: unquoted 8.8 is a YAML float.
      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.8'
          cache-provider: basic

      # Maven Central throttles shared runners with HTTP 429, which is transient.
      - name: Build the mod
        run: |
          for attempt in 1 2 3; do
            if gradle build --no-daemon; then exit 0; fi
            echo "Build attempt $attempt failed, retrying in 30s..." >&2
            sleep 30
          done
          exit 1

      - name: Upload jar
        uses: actions/upload-artifact@v6
        with:
          name: agrarian-futures
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
